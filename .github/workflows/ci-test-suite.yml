name: CI Test Suite

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Core Linter
        run: npm run lint

      - name: Run Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Run Automated Test Suite
        run: npm test

      - name: Check HTML Validation
        run: npx html-validator-cli --file=solar-throne.html

      - name: Package Solar Throne ZIP
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp solar-throne.html dist/index.html
          zip -r solar-throne-site.zip dist

      - name: Upload Solar Throne ZIP
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: solar-throne-site
          path: solar-throne-site.zip
          if-no-files-found: error
          retention-days: 30
